name: Release

# Publishing a GitHub release tagged e.g. "v0.1.0" builds module.zip and attaches
# it together with module.json. Foundry/The Forge install from:
# https://github.com/V-Cancrosa/Weather_Forging/releases/latest/download/module.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Stamp version and download URL
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build zip
        run: zip -r module.zip module.json README.md scripts styles templates lang

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" module.json module.zip --clobber
