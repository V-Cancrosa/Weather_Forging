name: Release

# Pushing a tag like "v0.1.0" runs the tests, builds module.zip and publishes a
# GitHub release with module.zip and module.json attached.
# Foundry / The Forge install from:
# https://github.com/V-Cancrosa/Weather_Forging/releases/latest/download/module.json

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm test

      - name: Stamp version and download URL
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build zip
        run: zip -r module.zip module.json LICENSE README.md scripts styles templates lang

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" module.json module.zip \
            --title "Weather Forging $TAG" --generate-notes --verify-tag
